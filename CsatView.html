<script>
// ============================================================
// CsatView — Agent / Manager / All-Teams CSAT Dashboard
// Save this block as CsatView.html in Apps Script and add
// <?!= include('CsatView') ?> just before </body> in Index.html
// ============================================================

// ── Entry point ───────────────────────────────────────────────────────────
function renderCsatView() {
  var el = document.getElementById('view-csat');
  el.innerHTML = buildCsatShell();

  // Load available months into picker
  google.script.run
    .withSuccessHandler(function(months) {
      var picker = document.getElementById('csat-month-picker');
      if (!picker) return;
      picker.innerHTML = months.map(function(m, i) {
        return '<option value="' + m + '"' + (i === 0 ? ' selected' : '') + '>' + m + '</option>';
      }).join('');
    window._csatSelectedMonth = months[0] || '';
      switchCsatTab(defaultTab); // ← moved INSIDE the callback
    })
    .withFailureHandler(function() {
      switchCsatTab(defaultTab); // fallback if months fail
    })
    .clientGetAvailableCsatMonths();

  var role = APP.session ? APP.session.role : 'agent';
  var defaultTab = (role === 'manager' || role === 'supervisor') ? 'manager' : 'agent';
  // switchCsatTab is now called inside the success handler above
}

function buildCsatShell() {
  var role = APP.session ? APP.session.role : 'agent';
  var isMgmt = role === 'manager' || role === 'supervisor';
  var isManager = role === 'manager';

  var tabs =
    '<div class="csat-tab-row">' +
      csatTab('agent',    '👤', 'My Scores',  true) +
      (isMgmt ? csatTab('manager', '📋', 'My Team') : '') +
      (isManager ? csatTab('allteams', '🌐', 'All Teams') : '') +
    '</div>';

  // Manager agent selector dropdown
  var agentSelector = '';
  if (isMgmt) {
    agentSelector =
      '<div id="csat-agent-selector" style="display:none;margin-bottom:14px;padding:12px 16px;' +
      'background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);' +
      'display:none;align-items:center;gap:12px;">' +
        '<label style="font-size:12px;font-weight:600;color:var(--text-secondary);' +
        'text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;">View agent:</label>' +
        '<select id="csat-agent-picker" onchange="switchCsatAgent(this.value)" ' +
        'style="flex:1;max-width:280px;height:36px;background:var(--surface-2);' +
        'color:var(--text-primary);border:1px solid var(--border-strong);' +
        'border-radius:var(--radius-sm);padding:0 12px;font-size:13px;cursor:pointer;">' +
          '<option value="">— Select an agent —</option>' +
        '</select>' +
        '<span id="csat-agent-status" style="font-size:12px;color:var(--text-hint)"></span>' +
      '</div>';
  }

  return '<div id="csat-root">' +
    '<div class="csat-topbar">' +
      '<div class="csat-page-title">' +
        '<div class="csat-play-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="white">' +
        '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>' +
        'CSAT Dashboard' +
      '</div>' +
      '<div class="csat-controls">' +
        '<select id="csat-month-picker" class="csat-pill" ' +
        'onchange="onCsatMonthChange(this.value)" ' +
        'style="cursor:pointer;padding:3px 8px;min-width:110px;">' +
          '<option value="">Loading months…</option>' +
        '</select>' +
        (isManager ? '<button class="csat-pill" onclick="refreshCsatData()" title="Re-aggregate from source">↻ Refresh</button>' : '') +
      '</div>' +
    '</div>' +
    tabs +
    agentSelector +
    '<div id="csat-panel-agent"  class="csat-panel"></div>' +
    '<div id="csat-panel-manager" class="csat-panel" style="display:none"></div>' +
    '<div id="csat-panel-allteams" class="csat-panel" style="display:none"></div>' +
  '</div>';
}

function csatTab(id, icon, label, active) {
  return '<div class="csat-vtab' + (active ? ' csat-vtab-on' : '') + '" ' +
    'id="csat-tab-' + id + '" onclick="switchCsatTab(\'' + id + '\')">' +
    icon + ' ' + label + '</div>';
}

function switchCsatTab(id) {
  var role = APP.session ? APP.session.role : 'agent';
  var isManager = role === 'manager';

  var tabs = ['agent','manager'];
  if (isManager) tabs.push('allteams');

  ['agent','manager','allteams'].forEach(function(t) {
    var panel = document.getElementById('csat-panel-' + t);
    var tab   = document.getElementById('csat-tab-' + t);
    if (!panel || !tab) return;
    var on = t === id;
    panel.style.display = on ? 'block' : 'none';
    tab.classList.toggle('csat-vtab-on', on);
  });

  // Show/hide agent selector only on My Scores tab for managers
  var selector = document.getElementById('csat-agent-selector');
  if (selector) {
    var role = APP.session ? APP.session.role : 'agent';
    var isMgmt = role === 'manager' || role === 'supervisor';
    selector.style.display = (id === 'agent' && isMgmt) ? 'flex' : 'none';
    // Populate dropdown if empty
    if (id === 'agent' && isMgmt) {
      populateCsatAgentDropdown();
    }
  }

  var panel = document.getElementById('csat-panel-' + id);
  if (panel && panel.dataset.loaded !== 'true') {
    panel.dataset.loaded = 'true';
    loadCsatPanel(id, panel);
  }
}

// Populate the agent dropdown for manager view
function populateCsatAgentDropdown() {
  var picker = document.getElementById('csat-agent-picker');
  if (!picker || picker.dataset.loaded === 'true') return;
  picker.dataset.loaded = 'true';

  google.script.run
    .withSuccessHandler(function(agents) {
      picker.innerHTML = '<option value="">— Select an agent —</option>';
      (agents || []).forEach(function(a) {
        var opt = document.createElement('option');
        opt.value = a.ldap;
        opt.textContent = (a.displayName || a.ldap) + ' (' + a.ldap + ')';
        picker.appendChild(opt);
      });
    })
    .withFailureHandler(function() {})
    .clientGetAllAgents();
}

// Switch My Scores view to show a specific agent's data
function switchCsatAgent(ldap) {
  var panel = document.getElementById('csat-panel-agent');
  var status = document.getElementById('csat-agent-status');
  if (!panel) return;

  if (!ldap) {
    // Reset to manager's own scores
    panel.dataset.loaded = '';
    panel.innerHTML = '';
    loadCsatPanel('agent', panel);
    if (status) status.textContent = '';
    return;
  }

  if (status) status.textContent = 'Loading…';
  panel.innerHTML = '<div class="loading-state"><div class="spinner"></div>' +
    '<span>Loading agent scores…</span></div>';

  google.script.run
    .withSuccessHandler(function(d) {
      panel.innerHTML = buildAgentView(d);
      if (status) status.textContent = '';
    })
    .withFailureHandler(function() {
      showToast('Could not load agent CSAT.', 'error');
      if (status) status.textContent = 'Error loading data.';
    })
    .clientGetMyCsat(ldap);
}

function onCsatMonthChange(month) {
  window._csatSelectedMonth = month;
  // Force all panels to reload with new month
  ['agent','manager','allteams'].forEach(function(t) {
    var p = document.getElementById('csat-panel-' + t);
    if (p) { p.dataset.loaded = ''; p.innerHTML = ''; }
  });
  // Reload whichever tab is currently active
  var activeTab = document.querySelector('.csat-vtab-on');
  if (activeTab) {
    var id = activeTab.id.replace('csat-tab-','');
    var panel = document.getElementById('csat-panel-' + id);
    if (panel) {
      panel.dataset.loaded = 'true';
      loadCsatPanel(id, panel);
    }
  }
}

// ── Panel loaders ─────────────────────────────────────────────────────────
function loadCsatPanel(id, panel) {
  panel.innerHTML =
    '<div style="padding:8px 0">' +
      '<div style="height:120px;background:var(--surface);border:1px solid var(--border);' +
      'border-radius:var(--radius-md);margin-bottom:10px;animation:shimmer 1.2s infinite;' +
      'background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);' +
      'background-size:200% 100%;"></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px">' +
        [1,2,3,4].map(function() {
          return '<div style="height:80px;border-radius:var(--radius-sm);' +
          'animation:shimmer 1.2s infinite;' +
          'background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);' +
          'background-size:200% 100%;"></div>';
        }).join('') +
      '</div>' +
      '<div style="height:200px;background:var(--surface);border:1px solid var(--border);' +
      'border-radius:var(--radius-md);animation:shimmer 1.2s infinite;' +
      'background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);' +
      'background-size:200% 100%;"></div>' +
    '</div>';
  var month = window._csatSelectedMonth || '';

  if (id === 'agent') {
    var agentPicker = document.getElementById('csat-agent-picker');
    var agentLdap = agentPicker ? agentPicker.value : '';
    google.script.run
      .withSuccessHandler(function(d) { panel.innerHTML = buildAgentView(d); })
      .withFailureHandler(function(e) { panel.innerHTML = csatError(e); })
      .clientGetMyCsat(agentLdap, month);

  } else if (id === 'manager') {
    google.script.run
      .withSuccessHandler(function(d) { panel.innerHTML = buildManagerView(d); })
      .withFailureHandler(function(e) { panel.innerHTML = csatError(e); })
      .clientGetTeamCsat(month);

  } else if (id === 'allteams') {
    google.script.run
      .withSuccessHandler(function(d) { panel.innerHTML = buildAllTeamsView(d); })
      .withFailureHandler(function(e) { panel.innerHTML = csatError(e); })
      .clientGetAllTeamsCsat(month);
  }
}

function refreshCsatData() {
  showToast('Re-aggregating CSAT data… this may take 30–60 seconds.', 'warning', 5000);
  google.script.run
    .withSuccessHandler(function() {
      showToast('CSAT data refreshed!', 'success');
      // Reset all panels so they reload fresh
      ['agent','manager','allteams'].forEach(function(t) {
        var p = document.getElementById('csat-panel-' + t);
        if (p) { p.dataset.loaded = ''; p.innerHTML = ''; }
      });
      switchCsatTab('agent');
    })
    .withFailureHandler(function(e) { showToast('Refresh failed: ' + e.message, 'error'); })
    .clientRunCsatAggregation();
}

// ── AGENT VIEW ────────────────────────────────────────────────────────────
function buildAgentView(d) {
  if (!d || !d.hasData) {
    return '<div class="empty-state">' +
      '<div class="empty-state-icon">📊</div>' +
      '<h3>No CSAT data yet</h3>' +
      '<p>Your scores for ' + (d ? d.month : 'this month') + ' will appear once the CSAT data has been aggregated.</p>' +
    '</div>';
  }

  updateCsatMonthLabel(d.month);

  var statusBg = { on_target: '#e6f4ea', monitor: '#fff8e1', at_risk: '#fce8e6' };
  var statusColor = { on_target: '#01875f', monitor: '#b8860b', at_risk: '#c0392b' };
  var statusLabel = { on_target: 'On Target', monitor: 'Monitor', at_risk: '⚠ At Risk' };

  return (
    // ── Profile card ──
    '<div class="csat-card csat-agent-hero">' +
      '<div class="csat-agent-avatar">' + (d.ldap || '?').charAt(0).toUpperCase() + '</div>' +
      '<div>' +
        '<div class="csat-agent-name">' + escHtml(d.displayName || d.ldap) + '</div>' +
        '<div class="csat-agent-meta">' + escHtml(d.ldap) + ' · Supervisor: ' + escHtml(d.tcLdap) + '</div>' +
        '<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">' +
          csatStatusChip(d.status) +
          (d.teamRank ? '<span class="csat-tag">Rank #' + d.teamRank + ' of ' + d.teamSize + ' in team</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>' +

    // ── Four score cards ──
    '<div class="csat-score-row">' +
      buildScoreCard('Overall', d.overall, d.overallResponses, d.delta ? d.delta.overall : null, '#01875f', '✦') +
      buildScoreCard('Chat', d.chat, d.chatResponses, d.delta ? d.delta.chat : null, '#4285F4', '💬') +
      buildScoreCard('Phone', d.phone, d.phoneResponses, d.delta ? d.delta.phone : null, '#7c4dff', '📞') +
      buildScoreCard('Email', d.email, d.emailResponses, d.delta ? d.delta.email : null, '#e65100', '✉️') +
    '</div>' +

    // ── Me vs team + DSAT themes ──
    '<div class="csat-two-col">' +

      // Me vs team
      '<div class="csat-card-sm">' +
        '<div class="csat-p-title">Me vs team average</div>' +
        '<div class="csat-legend-row">' +
          '<div class="csat-leg-item"><div class="csat-leg-dot" style="background:#01875f"></div>My score</div>' +
          '<div class="csat-leg-item"><div class="csat-leg-dot" style="background:rgba(66,133,244,0.45)"></div>Team avg</div>' +
        '</div>' +
        buildVsRow('Overall', d.overall, d.vsTeam ? d.vsTeam.overall : null) +
        buildVsRow('Chat',    d.chat,    d.vsTeam ? d.vsTeam.chat    : null, '#4285F4') +
        buildVsRow('Phone',   d.phone,   d.vsTeam ? d.vsTeam.phone   : null, '#7c4dff') +
        buildVsRow('Email',   d.email,   d.vsTeam ? d.vsTeam.email   : null, '#e65100') +
      '</div>' +

      // DSAT themes
      '<div class="csat-card-sm">' +
        '<div class="csat-p-title">My DSAT themes this month</div>' +
        buildDsatThemeBars(d.dsatThemes, d.dsatCount) +
        '<div style="margin-top:10px;font-size:11px;color:var(--color-text-secondary)">' +
          d.dsatCount + ' DSAT · ' + d.csatCount + ' CSAT · ' + d.totalSurveyed + ' total surveyed' +
        '</div>' +
      '</div>' +

    '</div>' +

    // ── Quality metrics strip ──
    '<div class="csat-card-sm">' +
      '<div class="csat-p-title">Quality metrics</div>' +
      '<div class="csat-metrics-strip">' +
        csatMetricItem(d.casesResolutionRate !== null ? d.casesResolutionRate + '%' : '—', 'Resolution rate', d.casesResolutionRate !== null && d.casesResolutionRate >= 90 ? '#01875f' : 'var(--color-text-primary)') +
        csatMetricItem(d.repeatContactRate  !== null ? d.repeatContactRate  + '%' : '—', 'Repeat contact (7d)', 'var(--color-text-primary)') +
        csatMetricItem(d.surveyOfferRate    !== null ? d.surveyOfferRate    + '%' : '—', 'Survey offer rate', 'var(--color-text-primary)') +
        csatMetricItem(d.totalCases || '—', 'Total cases handled', 'var(--color-text-primary)') +
      '</div>' +
    '</div>' +

    // ── Case log ──
    buildCaseLogTable(d.caseLog, 'My Cases This Month') +
    buildCoachingSection('agent', d.ldap, d.month)
  );
}

// ── MANAGER VIEW ──────────────────────────────────────────────────────────
function buildManagerView(d) {
  if (!d || !d.overall === undefined) {
    return '<div class="empty-state"><div class="empty-state-icon">📊</div><h3>No team data available.</h3></div>';
  }

  updateCsatMonthLabel(d.month);

  var atRisk = d.atRiskCount > 0
    ? '<div class="csat-risk-strip">⚠ <strong>' + d.atRiskCount + ' agent' + (d.atRiskCount > 1 ? 's' : '') +
      ' below target</strong> — review their DSAT themes and consider a 1:1 coaching session.</div>'
    : '';

  return (
    // ── Hero row ──
    '<div class="csat-hero-row">' +
      buildHeroCard('Team CSAT',  d.overall, d.overallResponses, d.delta ? d.delta.overall : null, '#01875f', 'hc-ov', '✦') +
      buildHeroCard('Chat CSAT',  d.chat,    d.chatResponses,    d.delta ? d.delta.chat    : null, '#4285F4', 'hc-ch', '💬') +
      buildHeroCard('Phone CSAT', d.phone,   d.phoneResponses,   d.delta ? d.delta.phone   : null, '#7c4dff', 'hc-ph', '📞') +
      buildHeroCard('Email CSAT', d.email,   d.emailResponses,   d.delta ? d.delta.email   : null, '#e65100', 'hc-em', '✉️') +
    '</div>' +

    // ── Summary strip ──
    '<div class="csat-strip">' +
      csatStripItem(d.totalSurveyed, 'Surveys', 'var(--color-text-primary)') +
      '<div class="csat-st-div"></div>' +
      csatStripItem(d.csatCount, 'CSAT', '#01875f') +
      '<div class="csat-st-div"></div>' +
      csatStripItem(d.dsatCount, 'DSAT', '#c0392b') +
      '<div class="csat-st-div"></div>' +
      csatStripItem(d.surveyOfferRate !== null ? d.surveyOfferRate + '%' : '—', 'Offer rate', 'var(--color-text-primary)') +
      '<div class="csat-st-div"></div>' +
      csatStripItem(d.atRiskCount, 'At risk', d.atRiskCount > 0 ? '#c0392b' : 'var(--color-text-secondary)') +
      '<div class="csat-strip-bar">' +
        '<div style="font-size:10px;color:var(--color-text-secondary);margin-bottom:4px">CSAT / DSAT / No survey</div>' +
        '<div class="csat-stacked">' +
          (d.totalSurveyed > 0
            ? '<div class="csat-seg" style="width:' + pctWidth(d.csatCount, d.totalCases) + '%;background:#01875f;opacity:.8"></div>' +
              '<div class="csat-seg" style="width:' + pctWidth(d.dsatCount, d.totalCases) + '%;background:#c0392b;opacity:.8"></div>'
            : '') +
          '<div class="csat-seg" style="flex:1;background:var(--color-background-secondary)"></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    atRisk +

    // ── DSAT themes + placeholder for trend ──
    '<div class="csat-two-col">' +
      '<div class="csat-card-sm">' +
        '<div class="csat-p-title">Top DSAT symptoms — team</div>' +
        buildDsatThemeBars(d.topDsatThemes, d.dsatCount) +
      '</div>' +
      '<div class="csat-card-sm">' +
        '<div class="csat-p-title">Channel breakdown</div>' +
        buildChannelRows(d) +
      '</div>' +
    '</div>' +

    // ── Agent scorecard ──
    '<div class="csat-card-sm">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
        '<div class="csat-p-title" style="margin-bottom:0">Agent scorecard</div>' +
        '<div style="font-size:11px;color:var(--color-text-secondary)">Sorted by overall CSAT %</div>' +
      '</div>' +
      buildAgentScorecard(d.agents) +
    '</div>' +

    // ── Team Case Log ──
    '<div id="team-caselog-section">' +
      buildCaseLogTable(d.caseLog, 'Team Cases (Surveyed) — ' + (d.month || '')) +
    '</div>' +

    buildCoachingSection('manager', '', d.month)
  );
}

// ── ALL TEAMS VIEW ────────────────────────────────────────────────────────
function buildAllTeamsView(d) {
  if (!d || !d.teams || d.teams.length === 0) {
    return '<div class="empty-state"><div class="empty-state-icon">🌐</div><h3>No cross-team data yet.</h3><p>Run the CSAT aggregation first.</p></div>';
  }

  updateCsatMonthLabel(d.month);

  var maxSurveyed = Math.max.apply(null, d.teams.map(function(t) { return t.totalSurveyed || 0; }));

  return (
    // ── Site summary ──
    '<div class="csat-at-summary">' +
      '<div class="csat-at-card" style="border-top:3px solid #01875f">' +
        '<div class="csat-lbl">Site-wide CSAT</div>' +
        '<div class="csat-at-val" style="color:#01875f">' + fmtPct(d.siteOverall) + '</div>' +
        '<div class="csat-at-sub">All teams · ' + escHtml(d.month) + deltaBadge(d.siteDelta) + '</div>' +
      '</div>' +
      '<div class="csat-at-card">' +
        '<div class="csat-lbl">Total surveys</div>' +
        '<div class="csat-at-val">' + (d.totalSurveyed || 0).toLocaleString() + '</div>' +
        '<div class="csat-at-sub">Across all teams</div>' +
      '</div>' +
      '<div class="csat-at-card">' +
        '<div class="csat-lbl">Teams tracked</div>' +
        '<div class="csat-at-val">' + d.teamCount + '</div>' +
        '<div class="csat-at-sub">' +
          (d.atRiskTeams > 0 ? '<span style="color:#c0392b">' + d.atRiskTeams + ' at risk</span>' : 'All healthy') +
        '</div>' +
      '</div>' +
    '</div>' +

    // ── Team ranking ──
    '<div class="csat-two-col">' +
      '<div class="csat-card-sm">' +
        '<div class="csat-p-title">Team ranking — overall CSAT %</div>' +
        '<div class="csat-legend-row" style="margin-bottom:10px">' +
          '<div class="csat-leg-item"><div class="csat-leg-dot" style="background:#01875f"></div>≥85% on target</div>' +
          '<div class="csat-leg-item"><div class="csat-leg-dot" style="background:#f9ab00"></div>75–84% monitor</div>' +
          '<div class="csat-leg-item"><div class="csat-leg-dot" style="background:#c0392b"></div>&lt;75% at risk</div>' +
        '</div>' +
        d.teams.map(function(t, idx) {
          var barColor = t.status === 'on_target' ? '#01875f' : t.status === 'monitor' ? '#f9ab00' : '#c0392b';
          var pctColor = t.status === 'on_target' ? '#01875f' : t.status === 'monitor' ? '#b8860b' : '#c0392b';
          return '<div class="csat-team-row">' +
            '<div class="csat-team-rank">' + (idx + 1) + '</div>' +
            '<div style="flex:1">' +
              '<div class="csat-team-name">' + escHtml(t.teamName) +
                ' <span class="csat-site-chip">' + escHtml(t.tcLdap) + '</span></div>' +
              '<div class="csat-team-meta">' + t.agentCount + ' agents · ' + (t.totalSurveyed||0) + ' surveys</div>' +
            '</div>' +
            '<div style="width:110px">' +
              '<div class="csat-bar-track"><div class="csat-bar-fill" style="width:' + (t.overall || 0) + '%;background:' + barColor + '"></div></div>' +
              '<div style="display:flex;justify-content:space-between;margin-top:2px">' +
                '<span style="font-size:12px;font-weight:500;color:' + pctColor + '">' + fmtPct(t.overall) + '</span>' +
                deltaBadge(t.delta) +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>' +

      '<div class="csat-card-sm">' +
        '<div class="csat-p-title">Channel CSAT by team</div>' +
        '<table class="csat-ch-table"><thead><tr>' +
          '<th>Team</th>' +
          '<th style="color:#4285F4">💬 Chat</th>' +
          '<th style="color:#7c4dff">📞 Phone</th>' +
          '<th style="color:#e65100">✉️ Email</th>' +
        '</tr></thead><tbody>' +
        d.teams.map(function(t) {
          return '<tr>' +
            '<td style="font-weight:500">' + escHtml(t.teamName.replace('Team ','')) + '</td>' +
            '<td>' + csatChip(t.chat) + '</td>' +
            '<td>' + csatChip(t.phone) + '</td>' +
            '<td>' + csatChip(t.email) + '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table>' +
      '</div>' +
    '</div>'
  );
}

// ── AI COACHING SECTION ───────────────────────────────────────
function buildCoachingSection(type, ldap, month) {
  var id = 'coaching-' + type;
  return (
    '<div class="csat-card-sm" style="margin-top:10px;border-top:3px solid #4285F4" id="' + id + '-wrap">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
        '<div style="display:flex;align-items:center;gap:10px">' +
          '<div style="width:32px;height:32px;background:linear-gradient(135deg,#4285F4,#b388ff);' +
          'border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;">✨</div>' +
          '<div>' +
            '<div style="font-size:14px;font-weight:600;color:var(--text-primary)">AI Coaching Insights</div>' +
            '<div style="font-size:11px;color:var(--text-secondary)">Powered by Groq · ' + (month || '') + '</div>' +
          '</div>' +
        '</div>' +
        '<button onclick="loadCoaching(\'' + type + '\',\'' + (ldap || '') + '\',\'' + (month || '') + '\')" ' +
        'id="' + id + '-btn" ' +
        'style="background:linear-gradient(135deg,#4285F4,#b388ff);color:#fff;border:none;' +
        'border-radius:20px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;' +
        'font-family:inherit;display:flex;align-items:center;gap:6px;">' +
          '✨ Generate Insights' +
        '</button>' +
      '</div>' +
      '<div id="' + id + '-content" style="display:none">' +
        '<div id="' + id + '-body"></div>' +
      '</div>' +
    '</div>'
  );
}

function loadCoaching(type, ldap, month) {
  var id = 'coaching-' + type;
  var btn = document.getElementById(id + '-btn');
  var content = document.getElementById(id + '-content');
  var body = document.getElementById(id + '-body');

  if (!btn || !content || !body) return;

  // If already loaded, toggle visibility
  if (content.dataset.loaded === 'true') {
    content.style.display = content.style.display === 'none' ? 'block' : 'none';
    btn.innerHTML = content.style.display === 'none' ? '✨ Show Insights' : '✨ Hide Insights';
    return;
  }

  // Show loading state
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;animation:spin .6s linear infinite">⟳</span> Analyzing…';
  content.style.display = 'block';
  body.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;padding:16px;' +
    'background:var(--surface-2);border-radius:8px;margin-bottom:8px">' +
      '<div style="width:32px;height:32px;border:3px solid #4285F4;border-top-color:transparent;' +
      'border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0"></div>' +
      '<div>' +
        '<div style="font-size:13px;font-weight:600;color:var(--text-primary)">Groq is analyzing your data…</div>' +
        '<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">This usually takes 5–10 seconds</div>' +
      '</div>' +
    '</div>';

  var handler = function(result) {
    btn.disabled = false;
    if (!result.success) {
      body.innerHTML =
        '<div style="background:var(--play-red-light);border:1px solid var(--play-red);' +
        'border-radius:8px;padding:14px;font-size:13px;color:var(--play-red)">' +
          '⚠ ' + escHtml(result.error || 'Could not generate insights.') +
        '</div>';
      btn.innerHTML = '✨ Retry';
      btn.disabled = false;
      return;
    }

    content.dataset.loaded = 'true';
    btn.innerHTML = '✨ Hide Insights';
    body.innerHTML = renderCoachingMarkdown(result.coaching);
  };

  if (type === 'agent') {
    google.script.run
      .withSuccessHandler(handler)
      .withFailureHandler(function(e) {
        handler({ success: false, error: e.message });
      })
      .clientGetAgentCoaching(ldap || '', month || '');
  } else {
    google.script.run
      .withSuccessHandler(handler)
      .withFailureHandler(function(e) {
        handler({ success: false, error: e.message });
      })
      .clientGetTeamCoaching(month || '');
  }
}

function renderCoachingMarkdown(text) {
  if (!text) return '';
  // Convert ## headers
  var html = text
    .replace(/## (.+)/g, '</div><div class="coaching-section"><div class="coaching-header">$1</div>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\* (.+)/g, '<div class="coaching-bullet">• $1</div>')
    .replace(/- (.+)/g, '<div class="coaching-bullet">• $1</div>')
    .replace(/\n\n/g, '<br>')
    .replace(/\n/g, '<br>');

  return '<div class="coaching-wrap">' + html + '</div>';
}

// ── SHARED RENDER HELPERS ─────────────────────────────────────────────────

function buildScoreCard(label, pct, responses, deltaVal, color, icon) {
  var displayPct = fmtPct(pct);
  var pctColor   = pct === null ? 'var(--color-text-hint)' : pct >= 85 ? '#01875f' : pct >= 75 ? '#b8860b' : '#c0392b';
  var circumference = 2 * Math.PI * 22; // r=22
  var strokeOffset  = pct !== null ? circumference * (1 - pct / 100) : circumference;

  return '<div class="csat-score-card" style="--accent:' + color + '">' +
    '<div class="csat-lbl">' + label + ' CSAT</div>' +
    '<div class="csat-gauge-wrap">' +
      '<svg width="56" height="56" viewBox="0 0 56 56" style="transform:rotate(-90deg)">' +
        '<circle cx="28" cy="28" r="22" fill="none" stroke="var(--color-background-secondary)" stroke-width="5"/>' +
        '<circle cx="28" cy="28" r="22" fill="none" stroke="' + color + '" stroke-width="5" ' +
          'stroke-dasharray="' + circumference.toFixed(1) + '" ' +
          'stroke-dashoffset="' + strokeOffset.toFixed(1) + '" stroke-linecap="round"/>' +
      '</svg>' +
      '<div class="csat-gauge-mid">' + (pct !== null ? Math.round(pct) + '%' : '—') + '</div>' +
    '</div>' +
    '<div class="csat-sc-val" style="color:' + pctColor + '">' + displayPct + '</div>' +
    '<div class="csat-sc-vol">' + (responses || 0) + ' responses</div>' +
    '<div class="csat-sc-trend">' + deltaBadge(deltaVal) + ' vs prev month</div>' +
  '</div>';
}

function buildHeroCard(label, pct, responses, deltaVal, color, cls, icon) {
  var pctColor = pct === null ? 'var(--color-text-hint)' : pct >= 85 ? '#01875f' : pct >= 75 ? '#b8860b' : '#c0392b';
  return '<div class="csat-hero-c ' + cls + '">' +
    '<div class="csat-lbl">' + label + '</div>' +
    '<div class="csat-h-pct" style="color:' + pctColor + '">' + fmtPct(pct) + '</div>' +
    '<div class="csat-h-vol">' + (responses || 0) + ' responses</div>' +
    '<div class="csat-h-trend">' + deltaBadge(deltaVal) + ' vs last month</div>' +
    '<div class="csat-hero-ico">' + icon + '</div>' +
  '</div>';
}

function buildVsRow(label, mine, team, accentColor) {
  accentColor = accentColor || '#01875f';
  var ahead = mine !== null && team !== null && mine >= team;
  var myW   = mine !== null ? Math.min(mine, 100) : 0;
  var tmW   = team !== null ? Math.min(team, 100) : 0;
  return '<div class="csat-vs-row">' +
    '<div class="csat-vs-lbl">' + label + '</div>' +
    '<div class="csat-vs-track">' +
      '<div style="position:absolute;top:0;left:0;height:100%;width:' + tmW + '%;background:rgba(66,133,244,0.35);border-radius:4px"></div>' +
      '<div style="position:absolute;top:0;left:0;height:100%;width:' + myW + '%;background:' + accentColor + ';border-radius:4px"></div>' +
    '</div>' +
    '<div class="csat-vs-pct" style="color:' + (ahead ? '#01875f' : '#c0392b') + '">' +
      (mine !== null ? mine + '%' : '—') +
      (team !== null ? '<span style="color:var(--color-text-tertiary);font-weight:400;font-size:9px"> ' + team + '%</span>' : '') +
    '</div>' +
  '</div>';
}

function buildDsatThemeBars(themes, total) {
  if (!themes || themes.length === 0) {
    return '<div style="font-size:12px;color:var(--color-text-secondary);padding:8px 0">No DSAT cases this month 🎉</div>';
  }
  var maxCount = themes[0].count;
  return themes.map(function(t) {
    var barW = maxCount > 0 ? Math.round(t.count / maxCount * 100) : 0;
    return '<div class="csat-bar-r">' +
      '<div style="flex:1;font-size:12px;color:var(--color-text-primary)">' + escHtml(t.symptom) + '</div>' +
      '<div class="csat-br-track"><div class="csat-br-fill" style="width:' + barW + '%;background:#c0392b"></div></div>' +
      '<div class="csat-br-pct">' + t.count + '</div>' +
    '</div>';
  }).join('');
}

function buildChannelRows(d) {
  return [
    { icon: '💬', label: 'Chat',  pct: d.chat,  resp: d.chatResponses,  color: '#4285F4' },
    { icon: '📞', label: 'Phone', pct: d.phone, resp: d.phoneResponses, color: '#7c4dff' },
    { icon: '✉️', label: 'Email', pct: d.email, resp: d.emailResponses, color: '#e65100' }
  ].map(function(ch) {
    var pctColor = ch.pct === null ? 'var(--color-text-hint)' : ch.pct >= 85 ? '#01875f' : ch.pct >= 75 ? '#b8860b' : '#c0392b';
    return '<div class="csat-ch-row">' +
      '<div style="display:flex;align-items:center;gap:8px">' +
        '<div class="csat-ch-icon" style="background:' + ch.color + '20;color:' + ch.color + '">' + ch.icon + '</div>' +
        '<div><div style="font-size:13px;color:var(--color-text-primary)">' + ch.label + '</div>' +
          '<div style="font-size:11px;color:var(--color-text-secondary)">' + (ch.resp || 0) + ' responses</div>' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div style="font-size:16px;font-weight:500;color:' + pctColor + '">' + fmtPct(ch.pct) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function buildAgentScorecard(agents) {
  if (!agents || agents.length === 0) return '<div class="empty-state" style="padding:20px"><h3>No agent data</h3></div>';

  var rows = agents.map(function(a) {
    var overallChip = csatChip(a.overall);
    var momaP = 'https://moma-teams-photos.corp.google.com/photos/' + a.ldap + '?sz=600&type=PLUS';
    var momaF = 'https://moma-teams-photos.corp.google.com/photos/' + a.ldap + '?sz=600&type=SECURITY&type=SILHOUETTE';
    var borderColor = a.status === 'at_risk' ? '#c0392b' : a.status === 'monitor' ? '#b8860b' : '#01875f';

    return '<tr onclick="navigate(\'agent-lookup\',{ldap:\'' + escHtml(a.ldap) + '\'})" style="cursor:pointer">' +
      '<td>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<div style="width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;' +
          'border:2px solid ' + borderColor + '">' +
            '<img src="' + momaP + '" ' +
            'onerror="this.onerror=null;this.src=\'' + momaF + '\';" ' +
            'style="width:100%;height:100%;object-fit:cover;display:block;">' +
          '</div>' +
          '<span style="font-size:13px;color:var(--text-primary)">' + escHtml(a.displayName || a.ldap) + '</span>' +
        '</div>' +
      '</td>' +
      '<td>' + (a.totalSurveyed || 0) + '</td>' +
      '<td>' + overallChip + '</td>' +
      '<td>' + fmtPct(a.chat) + '</td>' +
      '<td>' + fmtPct(a.phone) + '</td>' +
      '<td>' + fmtPct(a.email) + '</td>' +
      '<td style="color:' + (a.dsatCount > 0 ? '#c0392b' : 'var(--color-text-secondary)') + '">' + (a.dsatCount || 0) + '</td>' +
      '<td>' + csatStatusChip(a.status) + '</td>' +
      '<td><button class="btn btn-sm btn-secondary" style="font-size:10px;padding:4px 8px" ' +
        'onclick="event.stopPropagation(); toggleAgentCaseLog(\'' + escHtml(a.ldap) + '\')">' +
        'Cases' +
      '</button></td>' +
    '</tr>' +
    '<tr id="caselog-' + escHtml(a.ldap) + '" style="display:none"><td colspan="9" style="padding:0">' +
      buildCaseLogTable(a.caseLog, a.displayName + ' — Cases') +
    '</td></tr>';
  }).join('');

  return '<table class="csat-ag-tbl"><thead><tr>' +
    '<th style="text-align:left">Agent</th>' +
    '<th>Surveys</th><th>Overall</th><th>Chat</th><th>Phone</th><th>Email</th>' +
    '<th>DSATs</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

// ── MICRO COMPONENTS ──────────────────────────────────────────────────────
function fmtPct(pct) {
  if (pct === null || pct === undefined) return '—';
  return pct.toFixed(1) + '%';
}

function deltaBadge(d) {
  if (d === null || d === undefined) return '';
  var color = d > 0 ? '#01875f' : d < 0 ? '#c0392b' : 'var(--color-text-secondary)';
  var arrow = d > 0 ? '▲' : d < 0 ? '▼' : '→';
  return '<span style="font-size:10px;color:' + color + ';font-weight:500">' + arrow + ' ' + Math.abs(d).toFixed(1) + 'pp</span>';
}

function csatChip(pct) {
  if (pct === null || pct === undefined) return '<span style="font-size:11px;color:var(--color-text-tertiary);font-style:italic">—</span>';
  var cls = pct >= 85 ? 'csat-cg' : pct >= 75 ? 'csat-cy' : 'csat-cr';
  return '<span class="csat-chip ' + cls + '">' + fmtPct(pct) + '</span>';
}

function csatStatusChip(status) {
  var map = {
    on_target: ['csat-cg', 'On Target'],
    monitor:   ['csat-cy', 'Monitor'],
    at_risk:   ['csat-cr', '⚠ At Risk'],
    no_data:   ['csat-cn', 'No data']
  };
  var m = map[status] || map.no_data;
  return '<span class="csat-chip ' + m[0] + '">' + m[1] + '</span>';
}

function csatMetricItem(val, label, color) {
  return '<div style="text-align:center">' +
    '<div style="font-size:18px;font-weight:500;color:' + color + '">' + val + '</div>' +
    '<div style="font-size:10px;color:var(--color-text-secondary)">' + label + '</div>' +
  '</div>';
}

function csatStripItem(val, label, color) {
  return '<div class="csat-st-item">' +
    '<div class="csat-st-val" style="color:' + color + '">' + val + '</div>' +
    '<div class="csat-st-lbl">' + label + '</div>' +
  '</div>';
}

function pctWidth(part, total) {
  if (!total) return 0;
  return Math.min(Math.round(part / total * 100), 100);
}

function updateCsatMonthLabel(month) {
  var el = document.getElementById('csat-month-label');
  if (el && month) el.textContent = month;
}

function csatError(e) {
  return '<div class="empty-state">' +
    '<div class="empty-state-icon">⚠️</div>' +
    '<h3>Could not load data</h3>' +
    '<p>' + (e && e.message ? escHtml(e.message) : 'An error occurred. Try refreshing.') + '</p>' +
    '<button class="btn btn-secondary" onclick="renderCsatView()" style="margin-top:16px">Retry</button>' +
  '</div>';
}

function buildCaseLogTable(cases, title) {
  if (!cases || cases.length === 0) {
    return '<div class="csat-card-sm"><div class="csat-p-title">' + title + '</div>' +
      '<div style="font-size:12px;color:var(--color-text-secondary);padding:8px 0">No cases found for this period.</div></div>';
  }

  var rows = cases.map(function(c) {
    var satChip = c.satisfaction === 1
      ? '<span class="csat-chip csat-cg">CSAT</span>'
      : c.satisfaction === 0
        ? '<span class="csat-chip csat-cr">DSAT</span>'
        : '<span class="csat-chip csat-cn">No survey</span>';

    var score = c.csatScore !== null && c.csatScore !== ''
      ? '<span style="font-weight:600;color:var(--text-primary)">' + c.csatScore + '</span>'
      : '<span style="color:var(--text-hint)">—</span>';

    var comment = c.csatComment
      ? '<span style="font-size:11px;color:var(--text-secondary);font-style:italic">"' + escHtml(c.csatComment) + '"</span>'
      : '<span style="color:var(--text-hint);font-size:11px">—</span>';

    return '<tr>' +
      '<td style="font-weight:500;font-size:12px;width:140px;word-break:break-all">' +
        (c.caseId
          ? '<a href="https://cases.connect.corp.google.com/' + escHtml(c.caseId) + '" target="_blank" style="color:var(--play-blue);text-decoration:underline;font-weight:600;">' + escHtml(c.caseId) + '</a>'
          : '<span style="color:var(--text-hint)">—</span>') +
      '</td>' +
      '<td style="font-size:12px;width:80px">' + escHtml(c.channel || '—') + '</td>' +
      '<td style="font-size:12px;width:180px">' + escHtml(c.symptom || '—') + '</td>' +
      '<td style="text-align:center;width:60px">' + score + '</td>' +
      '<td style="text-align:center;width:90px">' + satChip + '</td>' +
      '<td style="max-width:220px;white-space:normal;word-wrap:break-word">' + comment + '</td>' +
    '</tr>';
  }).join('');

  return '<div class="csat-card-sm" style="margin-top:10px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
      '<div class="csat-p-title" style="margin-bottom:0">' + escHtml(title) + '</div>' +
      '<div style="font-size:11px;color:var(--text-secondary)">' + cases.length + ' cases</div>' +
    '</div>' +
    '<div style="overflow-x:auto">' +
      '<table class="csat-ag-tbl">' +
        '<thead><tr>' +
          '<thead><tr>' +
          '<th style="text-align:left;width:140px">Case ID</th>' +
          '<th style="text-align:left;width:80px">Channel</th>' +
          '<th style="text-align:left;width:180px">Symptom</th>' +
          '<th style="text-align:center;width:60px">Score</th>' +
          '<th style="text-align:center;width:90px">Result</th>' +
          '<th style="text-align:left">Comment</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
    '</div>' +
  '</div>';
}

function toggleAgentCaseLog(ldap) {
  var row = document.getElementById('caselog-' + ldap);
  if (!row) return;
  row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}

</script>
